services:
  # 1. Reverse Proxy & Frontend Static Delivery
  nginx:
    image: ghcr.io/faridahmad013/convertinaja-nginx:latest
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.frontend
    ports:
      # Terikat ke localhost:8081 agar tidak bentrok dengan Nginx Host (Port 80/443 & 8080)
      - "127.0.0.1:8081:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M

  # 2. Go API Server + Native CLI Conversion Engine (In-Process)
  api:
    image: ghcr.io/faridahmad013/convertinaja-api:latest
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.api
    environment:
      APP_PORT: "8080"
      APP_ENV: "production"
      STORAGE_DIR: "/tmp/convertinaja/jobs"
    volumes:
      - job_data:/tmp/convertinaja/jobs
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 1024M # Mencegah OOM pada VPS RAM 2GB saat LibreOffice aktif
        reservations:
          cpus: "0.2"
          memory: 256M
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

volumes:
  job_data:
